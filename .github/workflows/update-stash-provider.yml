name: Update Stash provider

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Stash proxy providers and Android profile
        env:
          STASH_SUBSCRIPTION_URL: ${{ secrets.STASH_SUBSCRIPTION_URL }}
        run: |
          test -n "$STASH_SUBSCRIPTION_URL"
          python scripts/build_stash_provider.py \
            --subscription-url "$STASH_SUBSCRIPTION_URL" \
            --output stash/providers/proxyplankton.yaml
          python scripts/filter_android_provider.py \
            --input stash/providers/proxyplankton.yaml \
            --output stash/providers/proxyplankton_android.yaml
          python scripts/build_android_config.py \
            --provider stash/providers/proxyplankton_android.yaml \
            --domains stash/rules/russia-direct-domains.txt \
            --ipv4 stash/rules/russia-direct-ipv4.txt \
            --ipv6 stash/rules/russia-direct-ipv6.txt \
            --output clash_config_android.yaml
      - name: Commit generated changes
        run: |
          if git diff --quiet -- stash/providers/proxyplankton.yaml stash/providers/proxyplankton_android.yaml clash_config_android.yaml; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stash/providers/proxyplankton.yaml stash/providers/proxyplankton_android.yaml clash_config_android.yaml
          git commit -m 'Update Stash providers and Android profile'
          git push
