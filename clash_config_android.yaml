# Stash Android configuration
# ProxyPlankton
#
# Если этот файл заменит:
# https://raw.githubusercontent.com/anthonyandreew/sub/main/clash_config.yaml
# можно раскомментировать следующую строку:
#
#SUBSCRIBED https://raw.githubusercontent.com/anthonyandreew/sub/main/clash_config.yaml


mode: rule
log-level: warning


# =========================================================
# DNS
# =========================================================
#
# На Android пока оставляем DNS максимально простым.
# Без fake-ip / enhanced-mode.
#

dns:
  default-nameserver:
    - 8.8.8.8
    - system

  nameserver:
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query


# =========================================================
# BOOTSTRAP PROXY
# =========================================================
#
# Нужен на случай, если remote provider ещё не успел
# загрузиться или временно недоступен.
#

proxies:
  - name: "BOOTSTRAP · Netherlands hy2"
    type: hysteria2
    server: 77.238.240.124
    port: 443
    auth: "OrIiY0H0TWccQgynotkJ"
    sni: proxyplankton.ru


# =========================================================
# PROXY PROVIDER
# =========================================================

proxy-providers:
  proxyplankton:
    url: https://raw.githubusercontent.com/anthonyandreew/sub/main/stash/providers/proxyplankton.yaml
    interval: 300


# =========================================================
# PROXY GROUP
# =========================================================
#
# Здесь будут:
#
# 1. Bootstrap Netherlands
# 2. Все подключения из ProxyPlankton
#
# Пользователь вручную выбирает нужное подключение.
#

proxy-groups:
  - name: PROXY
    type: select

    proxies:
      - "BOOTSTRAP · Netherlands hy2"

    use:
      - proxyplankton


# =========================================================
# RUSSIAN DIRECT RULE SETS
# =========================================================

rule-providers:

  russia-direct-domains:
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/anthonyandreew/sub/main/stash/rules/russia-direct-domains.txt
    interval: 86400

  russia-direct-ipv4:
    behavior: ipcidr
    format: text
    url: https://raw.githubusercontent.com/anthonyandreew/sub/main/stash/rules/russia-direct-ipv4.txt
    interval: 86400

  russia-direct-ipv6:
    behavior: ipcidr
    format: text
    url: https://raw.githubusercontent.com/anthonyandreew/sub/main/stash/rules/russia-direct-ipv6.txt
    interval: 86400


# =========================================================
# ROUTING
# =========================================================

rules:

  # -----------------------------
  # LOCAL NETWORK
  # -----------------------------

  - DOMAIN-SUFFIX,local,DIRECT

  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve


  # -----------------------------
  # RUSSIAN DOMAINS
  # -----------------------------

  - RULE-SET,russia-direct-domains,DIRECT


  # -----------------------------
  # RUSSIAN IP ADDRESSES
  # -----------------------------
  #
  # Специально БЕЗ no-resolve.
  #
  # Если домена нет в списке russia-direct-domains,
  # Stash сможет разрешить его IP и проверить,
  # находится ли адрес в российском диапазоне.
  #

  - RULE-SET,russia-direct-ipv4,DIRECT
  - RULE-SET,russia-direct-ipv6,DIRECT


  # -----------------------------
  # EVERYTHING ELSE
  # -----------------------------

  - MATCH,PROXY
